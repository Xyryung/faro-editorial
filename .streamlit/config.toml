# Tema de la interfaz (issue #16): paleta "papel" y letra IBM Plex Sans.
# La letra está en app/static/fonts (licencia SIL OFL 1.1, ver OFL-IBM-Plex.txt) y Streamlit
# la sirve localmente, así la demo funciona sin internet.

[server]
# Sirve app/static/ (las fuentes) desde la misma computadora.
enableStaticServing = true

[theme]
base = "light"
# Fondo crema cálido en vez de blanco puro (cansa menos la vista); texto casi negro cálido y un
# solo color de acento, el azul marino.
primaryColor = "#1F3A5F"
backgroundColor = "#F4F1EA"
secondaryBackgroundColor = "#EAE5DA"
textColor = "#2B2926"
linkColor = "#24507F"
font = "IBM Plex Sans, sans-serif"
baseFontSize = 15
# h1 (título), h2, h3 (titular de la ficha), h4 (secciones de la ficha), h5, h6
headingFontSizes = ["1.6rem", "1.35rem", "1.3rem", "0.95rem", "0.9rem", "0.85rem"]
baseRadius = "0.375rem"
borderColor = "#DDD7CB"
dataframeBorderColor = "#E2DCCF"
showWidgetBorder = true
showSidebarBorder = true

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Regular.woff2"
weight = 400
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Italic.woff2"
weight = 400
style = "italic"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-SemiBold.woff2"
weight = 600
style = "normal"

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "app/static/fonts/IBMPlexSans-Bold.woff2"
weight = 700
style = "normal"

[theme.sidebar]
backgroundColor = "#EDE9E0"
secondaryBackgroundColor = "#F4F1EA"

[client]
# Sin el botón "Deploy" ni las opciones de desarrollo.
toolbarMode = "minimal"

[browser]
# La demo no envía estadísticas de uso a Streamlit.
gatherUsageStats = false
