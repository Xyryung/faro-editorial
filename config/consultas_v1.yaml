# Conjunto de consultas para medir la abstención (sección 9.1 del reto, issue #19).
#
# Cada consulta lleva una etiqueta que es un hecho sobre el corpus de la demo, no una opinión
# del sistema: "respondible" si algún titular del snapshot contiene la respuesta (sus IDs van
# en evidencia_esperada) y "no_respondible" si ninguno la contiene. Se comprobaron buscando
# los términos en los 5138 titulares del snapshot de la demo (octubre 2025 a septiembre 2026).
#
# Las no respondibles "dificil: true" tratan un tema que sí está en el corpus, pero piden un
# dato que el titular no trae (por ejemplo, el monto que un titular anuncia sin decir). Son
# las que prueban la pregunta Noul: el umbral de recuperación solo no basta para rechazarlas.
#
# Los IDs son del snapshot de la demo: con otro snapshot hay que revisar el conjunto.
version: "consultas-v1"
revisado_por: "Kenneth"  # quién del equipo revisó las etiquetas (completar antes de reportar)

consultas:
